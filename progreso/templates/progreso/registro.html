{% extends "comun/base.html" %}
{% block titulo %}Registro - Re:Code{% endblock %}

{% block contenido %}
<h1>Nuevo alumno</h1>
<h2>Elige tu usuario y contraseña.</h2>

<form method="post" class="formulario">
    {% csrf_token %}
    {% for campo in form %}
    <label>{{ campo.label }}
        {{ campo }}
        {{ campo.errors }}
    </label>
    {% endfor %}
    <button type="submit">Crear cuenta</button>
</form>

<p>¿Ya tienes cuenta? <a href="{% url 'login' %}">Entra</a></p>
{% endblock %}
