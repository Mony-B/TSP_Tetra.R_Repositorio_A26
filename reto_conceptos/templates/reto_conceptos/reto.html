{% extends "comun/reto_base.html" %}
{% load static %}
{% block estilos %}
<style>
    .sopa-contenedor { display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start; }
    .sopa { display: grid; gap: 2px; user-select: none; }
    .sopa button {
        width: 32px; height: 32px; padding: 0;
        font-size: 1rem; font-weight: bold;
    }
    .sopa button.inicio { background: #005500; color: #fff; }
    .sopa button.encontrada { background: #003300; border-color: var(--verde-medio); color: #fff; }
    .definiciones { flex: 1; min-width: 220px; padding-left: 18px; margin: 0; }
    .definiciones li { margin-bottom: 8px; }
    .definiciones li.hecha { text-decoration: line-through; color: var(--verde-medio); }
    @media (max-width: 600px) { .sopa button { width: 28px; height: 28px; font-size: 0.85rem; } }
</style>
{% endblock %}
{% block juego %}
<div class="sopa-contenedor">
    <div class="sopa" id="sopa"></div>
    <ol class="definiciones" id="definiciones"></ol>
</div>
{% endblock %}
{% block script_juego %}<script src="{% static 'reto_conceptos/juego.js' %}"></script>{% endblock %}
