# Desarrollo local: un solo contenedor (Django). La base de datos es SQLite
# y vive en ./data/db.sqlite3, que se monta junto con el código.
services:
  web:
    build: .
    command: sh -c "python manage.py migrate && python manage.py seed_logica && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
