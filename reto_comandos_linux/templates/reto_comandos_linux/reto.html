{% extends "comun/reto_base.html" %}
{% load static %}
{% block estilos %}
<link rel="stylesheet" href="{% static 'reto_comandos_linux/css/terminal.css' %}">
{% endblock %}

{% block juego %}
<div id="linux" data-comando-url="{{ comando_url }}">
    <div class="terminal" id="terminal">
        <div id="lineas">
            <div class="linea info">Escribe help para ver los comandos disponibles.</div>
        </div>
        <form id="form-comando">
            <span class="prompt" id="prompt"></span>
            <input type="text" id="comando" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Comando">
        </form>
    </div>

    <div class="puerta" id="puerta">
        <span class="icono" id="icono-puerta" aria-hidden="true">🔒</span>
        <form id="form-puerta">
            <input type="text" id="clave" autocomplete="off" autocapitalize="off" spellcheck="false"
                   placeholder="Contraseña de la puerta" aria-label="Contraseña de la puerta">
            <button type="submit" class="boton" id="btn-abrir">Abrir</button>
        </form>
    </div>

    <div class="acciones-linux" id="acciones">
        <button type="button" class="boton peligro" id="btn-salir">Salir / Rendirse</button>
    </div>
</div>
<!-- Los diálogos de salir y de reto completado ya vienen de
     comun/reto_base.html (dialogo-salir, dialogo-exito); este reto usa el
     contenido default del segundo, así que no necesita sobreescribir
     el bloque "exito". -->
{% endblock %}

{% block script_juego %}<script src="{% static 'reto_comandos_linux/juego.js' %}"></script>{% endblock %}
