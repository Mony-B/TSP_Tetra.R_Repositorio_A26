{% extends "comun/reto_base.html" %}
{% load static %}
{% block estilos %}
<style>
  .sopa-encabezado {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 0.75rem;
  }

  .nivel {
    margin: 0;
    font-weight: bold;
  }

  .conceptos {
    margin: 0 0 1rem;
    padding-left: 1.25rem;
  }

  .conceptos li {
    margin-bottom: 0.375rem;
  }

  .conceptos li.hecha {
    color: var(--verde-medio);
  }

  .conceptos li.hecha span {
    text-decoration: line-through;
  }

  .sopa {
    display: grid;
    grid-template-columns: repeat(var(--columnas, 10), 1fr);
    gap: 0.125rem;
    width: 100%;
    max-width: 24rem;
    margin: 0 auto;
    touch-action: none;
    user-select: none;
  }

  .sopa button {
    aspect-ratio: 1;
    padding: 0;
    font-size: clamp(0.7rem, 3.2vw, 1rem);
    font-weight: bold;
  }

  .sopa button.seleccion {
    background: var(--verde-oscuro);
    border-color: var(--verde);
    border-radius: 50%;
    color: #fff;
  }

  .sopa button.encontrada {
    background: #003300;
    border-color: var(--verde-medio);
    color: #fff;
  }

  .sopa-encabezado [hidden] {
    display: none;
  }

  /* Los diálogos de salir y de reto completado (dialog.confirmar) ya
     vienen estilizados de comun/css/reto.css: no se redefinen aquí. */

  @media (min-width: 37.5rem) {
    .sopa {
      max-width: 30rem;
    }

    .sopa button {
      font-size: 1.25rem;
    }
  }
</style>
{% endblock %}

{% block juego %}
<div class="sopa-encabezado">
  <p class="nivel" id="nivel"></p>
  <button type="button" class="boton peligro" id="btn-salir">Salir / Rendirse</button>
</div>

<ul class="conceptos" id="conceptos"></ul>
<div class="sopa" id="sopa"></div>

<!-- Los diálogos de salir y de reto completado ya vienen de
     comun/reto_base.html (dialogo-salir / dialogo-exito); este reto usa
     el bloque "exito" por defecto, no necesita contenido extra. -->
{% endblock %}

{% block script_juego %}<script src="{% static 'reto_sopa_letras/juego.js' %}"></script>{% endblock %}
