<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subtemas - Re:Code</title>
    <style>
        body {
            margin: 0; padding: 0; height: 100vh;
            background-color: #0a0a0a;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            display: flex; justify-content: center; align-items: center;
        }
        .pantalla-principal {
            width: 800px; min-height: 500px;
            border: 2px solid #333;
            background: rgba(0, 0, 0, 0.9);
            padding: 30px; box-sizing: border-box;
            position: relative;
        }
        h1 { margin: 0; font-size: 1.5rem; text-decoration: underline; }
        .lista-subtemas {
            display: flex; flex-direction: column; gap: 12px;
            margin-top: 30px; padding-left: 20px;
        }
        .subtema-item {
            border: 1px solid #00ff00;
            padding: 12px 20px;
            color: #00ff00;
            text-decoration: none;
            display: block;
        }
        .subtema-item:hover { background: #002200; color: #fff; }
        .btn-regresar {
            position: absolute; bottom: 20px; left: 20px;
            color: #00aa00; text-decoration: none;
            border: 1px solid #00aa00; border-radius: 50%;
            width: 40px; height: 40px;
            display: flex; justify-content: center; align-items: center;
            font-size: 1.5rem;
        }
        .btn-regresar:hover { color: #00ff00; border-color: #00ff00; background: rgba(0,255,0,0.1); }
    </style>
</head>
<body>
    <div class="pantalla-principal">
        <h1>{{ tema.nombre_ruta }}</h1>

        <div class="lista-subtemas">
            {% for subtema in subtemas %}
            <a href="{% url 'seleccion_retos' subtema.id_subtema %}" class="subtema-item">
                {{ subtema.nombre_subtema }}
            </a>
            {% endfor %}
        </div>

        <a href="{% url 'lista_temas' %}" class="btn-regresar" title="Regresar">←</a>
    </div>
</body>
</html>
