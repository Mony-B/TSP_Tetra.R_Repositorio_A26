{% extends "comun/reto_base.html" %}
{% load static %}
{% block estilos %}<link rel="stylesheet" href="{% static 'reto_ecuaciones/matriz.css' %}">{% endblock %}
{% block juego %}

{{ datos_publicos|json_script:"matriz-datos" }}

<section id="matriz" class="matriz" data-revisar-url="{{ revisar_url }}">

    <p class="matriz-mision" id="matriz-mision"></p>

    <!-- Pantalla 1: matriz de referencia, matriz de respuesta y pistas -->
    <div id="matriz-escena">
        <div class="matriz-tableros">
            <div class="matriz-bloque">
                <h3 class="matriz-titulo">Matriz de referencia</h3>
                <div class="matriz-rejilla" id="matriz-referencia" role="table" aria-label="Matriz de referencia"></div>
            </div>
            <div class="matriz-bloque">
                <h3 class="matriz-titulo">Matriz de respuesta</h3>
                <div class="matriz-rejilla" id="matriz-respuesta" role="group" aria-label="Matriz de respuesta"></div>
            </div>
        </div>

        <div class="matriz-listas">
            <div class="matriz-bloque">
                <h3 class="matriz-titulo">Pistas</h3>
                <ol class="matriz-pistas" id="pistas-originales"></ol>
            </div>
            <div class="matriz-bloque">
                <h3 class="matriz-titulo">Pistas con tus valores</h3>
                <ol class="matriz-pistas" id="pistas-vivas" aria-live="polite"></ol>
            </div>
        </div>

        <p class="matriz-mensaje error" id="matriz-aviso" hidden role="alert"></p>

        <div class="matriz-acciones">
            <button type="button" class="boton" id="btn-verificar">&#10145; Verificar</button>
            <button type="button" class="boton peligro" id="btn-salir">Salir / Rendirse</button>
        </div>
    </div>
</section>

<!-- Los diálogos de salir y de reto completado ya vienen de
     comun/reto_base.html (dialogo-salir, dialogo-exito); este reto usa el
     contenido default del segundo, así que no necesita sobreescribir el
     bloque "exito". -->
{% endblock %}
{% block script_juego %}<script src="{% static 'reto_ecuaciones/juego.js' %}"></script>{% endblock %}
